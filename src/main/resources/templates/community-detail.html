<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${community.name})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="gp-page">
  <main class="gp-main">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Community Header -->
    <div class="gp-card" style="margin-bottom:20px;">
      <div style="height:120px;background:linear-gradient(135deg,#4285F4,#34A853);
                  border-radius:var(--gp-radius-lg) var(--gp-radius-lg) 0 0;
                  display:flex;align-items:center;justify-content:center;font-size:48px;">👥</div>
      <div style="padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
          <div>
            <h1 style="font-size:22px;font-weight:700;" th:text="${community.name}"></h1>
            <p style="color:var(--gp-text-2);font-size:14px;margin-top:4px;" th:text="${community.description}"></p>
            <div style="display:flex;gap:12px;margin-top:10px;font-size:13px;color:var(--gp-text-3);">
              <span>👥 <strong th:text="${memberCount}">0</strong> members</span>
              <span th:if="${community.category}" class="category-tag" th:text="${community.category}"></span>
              <span th:text="${community.visibility}"></span>
            </div>
          </div>
          <div>
            <form th:if="${!isMember}"
                  th:action="@{'/communities/' + ${community.id} + '/join'}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-primary">Join Community</button>
            </form>
            <form th:if="${isMember}"
                  th:action="@{'/communities/' + ${community.id} + '/leave'}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-outline"
                      onclick="return confirm('Leave this community?')">Leave</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Post Composer (members only) -->
    <div th:if="${isMember}" class="composer" style="margin-bottom:16px;">
      <form th:action="@{'/communities/' + ${community.id} + '/post'}"
            method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="composer-top">
          <img th:src="${currentUser.profilePicture != null ? currentUser.profilePicture : '/images/avatar-default.svg'}"
               class="post-avatar" alt=""/>
          <textarea name="content" placeholder="Share something with the community…"
                    maxlength="2000"></textarea>
        </div>
        <div class="composer-actions">
          <label for="c-image" class="btn btn-ghost btn-sm" style="cursor:pointer;">📷 Photo</label>
          <input type="file" id="c-image" name="image" accept="image/*" style="display:none;"/>
          <div style="flex:1;"></div>
          <button type="submit" class="btn btn-primary btn-sm">Post</button>
        </div>
      </form>
    </div>

    <!-- Posts -->
    <div th:if="${posts.isEmpty()}" class="empty-state">
      <div class="empty-state-icon">📝</div>
      <div class="empty-state-title">No posts yet</div>
      <div class="empty-state-desc" th:if="${isMember}">Be the first to post!</div>
      <div class="empty-state-desc" th:if="${!isMember}">Join the community to start posting.</div>
    </div>

    <div th:each="post : ${posts}" class="post-card">
      <div class="post-header">
        <div class="post-author">
          <a th:href="@{'/profile/' + ${post.author.username}}">
            <img th:src="${post.author.profilePicture != null ? post.author.profilePicture : '/images/avatar-default.svg'}"
                 class="post-avatar" alt=""/>
          </a>
          <div>
            <div class="post-author-name">
              <a th:href="@{'/profile/' + ${post.author.username}}"
                 th:text="${post.author.displayName}" style="color:inherit;"></a>
            </div>
            <div class="post-meta"
                 th:text="${#temporals.format(post.createdAt, 'MMM d, yyyy')}"></div>
          </div>
        </div>
        <form th:if="${post.author.id == currentUser.id}"
              th:action="@{'/posts/' + ${post.id} + '/delete'}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-ghost btn-sm"
                  onclick="return confirm('Delete?')" style="color:var(--google-red);">🗑</button>
        </form>
      </div>
      <div class="post-content" th:text="${post.content}"></div>
      <img th:if="${post.imageUrl != null}" th:src="${post.imageUrl}" class="post-image" alt=""/>
      <div class="post-actions">
        <form th:action="@{'/posts/' + ${post.id} + '/like'}" method="post" style="flex:1;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="post-action-btn">
            👍 Like (<span th:text="${post.reactions.size()}">0</span>)
          </button>
        </form>
        <form th:action="@{'/posts/' + ${post.id} + '/bookmark'}" method="post" style="flex:1;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="post-action-btn">🔖 Save</button>
        </form>
      </div>
    </div>

    <div th:if="${posts.totalPages > 1}" class="pagination">
      <a th:if="${!posts.first}"
         th:href="@{'/communities/' + ${community.id}(page=${posts.number - 1})}" class="page-btn">← Prev</a>
      <a th:if="${!posts.last}"
         th:href="@{'/communities/' + ${community.id}(page=${posts.number + 1})}" class="page-btn">Next →</a>
    </div>
  </main>
</div>

</body>
</html>
