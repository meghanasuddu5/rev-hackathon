<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="gp-page">
  <main class="gp-main">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="gp-card">
      <div class="gp-card-header">✏️ Edit Profile</div>
      <div class="gp-card-body">
        <form th:action="@{/profile/edit}" method="post"
              enctype="multipart/form-data" th:object="${profileUpdateDTO}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <!-- Avatar preview -->
          <div style="text-align:center;margin-bottom:20px;">
            <img th:src="${currentUser.profilePicture != null ? currentUser.profilePicture : '/images/avatar-default.svg'}"
                 id="avatar-preview"
                 style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--gp-border);"/>
            <div style="margin-top:10px;">
              <label for="profilePicFile" class="btn btn-outline btn-sm" style="cursor:pointer;">
                📷 Change Photo
              </label>
              <input type="file" id="profilePicFile" name="profilePicFile"
                     accept="image/*" style="display:none;"
                     onchange="previewAvatar(this)"/>
            </div>
          </div>

          <div class="gp-form-group">
            <label class="gp-label">Display Name</label>
            <input type="text" th:field="*{displayName}" class="gp-input"/>
            <div class="field-error" th:if="${#fields.hasErrors('displayName')}"
                 th:errors="*{displayName}"></div>
          </div>

          <div class="gp-form-group">
            <label class="gp-label">Bio</label>
            <textarea th:field="*{bio}" class="gp-textarea"
                      placeholder="Tell the world about yourself…" maxlength="300"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('bio')}"
                 th:errors="*{bio}"></div>
          </div>

          <div class="gp-form-group">
            <label class="gp-label">Profile Visibility</label>
            <div style="display:flex;gap:16px;margin-top:6px;">
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                <input type="radio" th:field="*{profilePublic}" value="true"/>
                🌐 Public
              </label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                <input type="radio" th:field="*{profilePublic}" value="false"/>
                🔒 Private
              </label>
            </div>
          </div>

          <div class="gp-form-group">
            <label class="gp-label">Your Interests</label>
            <div class="interests-grid" style="margin-top:8px;">
              <div th:each="interest : ${allInterests}">
                <input type="checkbox" th:id="'interest-' + ${interest}"
                       name="interests" th:value="${interest}"
                       class="interest-checkbox"
                       th:checked="${profileUpdateDTO.interests != null and profileUpdateDTO.interests.contains(interest)}"/>
                <label th:for="'interest-' + ${interest}"
                       class="interest-label" th:text="${interest}"></label>
              </div>
            </div>
          </div>

          <div style="display:flex;gap:10px;margin-top:8px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a th:href="@{'/profile/' + ${currentUser.username}}"
               class="btn btn-outline">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script>
function previewAvatar(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => document.getElementById('avatar-preview').src = e.target.result;
    reader.readAsDataURL(input.files[0]);
  }
}
</script>

</body>
</html>
