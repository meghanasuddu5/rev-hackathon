<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Discover')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="gp-page">
  <main style="max-width:960px;width:100%;">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:20px;">🧭 Discover</h1>

    <!-- People to Follow -->
    <div class="gp-card" style="margin-bottom:24px;">
      <div class="gp-card-header">👤 People you may know</div>
      <div class="gp-card-body">
        <div th:if="${suggestedUsers.isEmpty()}" style="color:var(--gp-text-3);font-size:14px;">
          No suggestions available.
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;">
          <div th:each="user : ${suggestedUsers}"
               style="border:1px solid var(--gp-border);border-radius:var(--gp-radius-lg);
                      padding:16px;text-align:center;background:var(--gp-bg);">
            <a th:href="@{'/profile/' + ${user.username}}">
              <img th:src="${user.profilePicture != null ? user.profilePicture : '/images/avatar-default.svg'}"
                   style="width:60px;height:60px;border-radius:50%;object-fit:cover;margin-bottom:8px;"/>
            </a>
            <div style="font-weight:600;font-size:14px;" th:text="${user.displayName}"></div>
            <div style="font-size:12px;color:var(--gp-text-3);margin-bottom:8px;"
                 th:text="'@' + ${user.username}"></div>
            <div style="font-size:12px;color:var(--gp-text-2);margin-bottom:10px;"
                 th:if="${user.bio}" th:text="${user.bio.length() > 50 ? user.bio.substring(0,50) + '…' : user.bio}"></div>
            <form th:action="@{'/follow/' + ${user.username}}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-primary btn-sm" style="width:100%;justify-content:center;">
                + Follow
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Communities to Explore -->
    <div class="gp-card">
      <div class="gp-card-header">👥 Communities to explore</div>
      <div class="gp-card-body">
        <div class="community-grid">
          <div th:each="community : ${communities}" class="community-card">
            <div class="community-banner">
              <span>👥</span>
            </div>
            <div class="community-card-body">
              <div class="community-name" th:text="${community.name}"></div>
              <div class="community-desc"
                   th:text="${community.description != null ? (community.description.length() > 70 ? community.description.substring(0,70)+'…' : community.description) : ''}"></div>
              <div class="community-meta">
                <span th:if="${community.category}" class="category-tag"
                      th:text="${community.category}"></span>
              </div>
              <div style="display:flex;gap:8px;">
                <a th:href="@{'/communities/' + ${community.id}}"
                   class="btn btn-outline btn-sm" style="flex:1;justify-content:center;">View</a>
                <form th:action="@{'/communities/' + ${community.id} + '/join'}"
                      method="post" style="flex:1;">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-primary btn-sm"
                          style="width:100%;justify-content:center;">Join</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
