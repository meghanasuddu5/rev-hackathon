<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' — Google+'">Google+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
</head>

<body>

<!-- TOP NAV -->
<nav th:fragment="navbar" class="gp-navbar">
  <div class="gp-navbar-inner">
    <div class="gp-navbar-left">
      <a th:href="@{/feed}" class="gp-logo">
        <span class="logo-g">G</span><span class="logo-plus">+</span>
      </a>
    </div>

    <div class="gp-navbar-center">
      <form th:action="@{/search}" method="get" class="gp-search-form">
        <span class="search-icon">🔍</span>
        <input type="text" name="q" placeholder="Search Google+" class="gp-search-input" autocomplete="off"/>
      </form>
    </div>

    <div class="gp-navbar-right">
      <a th:href="@{/notifications}" class="gp-icon-btn" title="Notifications">
        <span class="notif-bell">🔔</span>
        <span th:if="${unreadCount != null and unreadCount > 0}"
              th:text="${unreadCount}" class="notif-badge"></span>
      </a>
      <div class="gp-avatar-menu">
        <img th:src="${currentUser?.profilePicture != null ? currentUser.profilePicture : '/images/avatar-default.svg'}"
             class="gp-avatar-sm" alt="Profile"/>
        <div class="gp-dropdown">
          <a th:href="@{'/profile/' + ${currentUser?.username}}">My Profile</a>
          <a th:href="@{/profile/edit}">Edit Profile</a>
          <a th:href="@{/settings}">Settings</a>
          <hr class="dropdown-divider"/>
          <form th:action="@{/auth/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="dropdown-logout">Sign out</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- SIDEBAR -->
<aside th:fragment="sidebar" class="gp-sidebar">
  <nav class="gp-sidenav">
    <a th:href="@{/feed}" class="sidenav-item">
      <span class="sidenav-icon">🏠</span> <span>Home</span>
    </a>
    <a th:href="@{/discover}" class="sidenav-item">
      <span class="sidenav-icon">🧭</span> <span>Discover</span>
    </a>
    <a th:href="@{/circles}" class="sidenav-item">
      <span class="sidenav-icon">⭕</span> <span>Circles</span>
    </a>
    <a th:href="@{/communities}" class="sidenav-item">
      <span class="sidenav-icon">👥</span> <span>Communities</span>
    </a>
    <a th:href="@{/bookmarks}" class="sidenav-item">
      <span class="sidenav-icon">🔖</span> <span>Bookmarks</span>
    </a>
    <a th:href="@{/notifications}" class="sidenav-item">
      <span class="sidenav-icon">🔔</span> <span>Notifications</span>
    </a>
    <hr class="sidenav-divider"/>
    <a th:href="@{/settings}" class="sidenav-item">
      <span class="sidenav-icon">⚙️</span> <span>Settings</span>
    </a>
    <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="sidenav-item sidenav-admin">
      <span class="sidenav-icon">🛡️</span> <span>Admin</span>
    </a>
  </nav>
</aside>

<!-- FLASH MESSAGES -->
<div th:fragment="flash">
  <div th:if="${success}" class="gp-alert gp-alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="gp-alert gp-alert-error" th:text="${error}"></div>
  <div th:if="${message}" class="gp-alert gp-alert-info" th:text="${message}"></div>
</div>

</body>
</html>
