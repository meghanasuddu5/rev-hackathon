<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bookmarks')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="gp-page">
  <main class="gp-main">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:20px;">🔖 Saved Posts</h1>

    <div th:if="${posts.isEmpty()}" class="empty-state">
      <div class="empty-state-icon">🔖</div>
      <div class="empty-state-title">No saved posts</div>
      <div class="empty-state-desc">Bookmark posts to find them here later.</div>
    </div>

    <div th:each="post : ${posts}" class="post-card">
      <div class="post-header">
        <div class="post-author">
          <a th:href="@{'/profile/' + ${post.author.username}}">
            <img th:src="${post.author.profilePicture != null ? post.author.profilePicture : '/images/avatar-default.svg'}"
                 class="post-avatar" alt=""/>
          </a>
          <div>
            <div class="post-author-name">
              <a th:href="@{'/profile/' + ${post.author.username}}"
                 th:text="${post.author.displayName}" style="color:inherit;"></a>
            </div>
            <div class="post-meta"
                 th:text="${#temporals.format(post.createdAt, 'MMM d, yyyy')}"></div>
          </div>
        </div>
        <form th:action="@{'/posts/' + ${post.id} + '/bookmark'}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-ghost btn-sm" style="color:var(--google-red);">
            🗑 Remove
          </button>
        </form>
      </div>
      <div class="post-content" th:text="${post.content}"></div>
      <img th:if="${post.imageUrl != null}" th:src="${post.imageUrl}" class="post-image" alt=""/>
    </div>

    <div th:if="${posts.totalPages > 1}" class="pagination">
      <a th:if="${!posts.first}"
         th:href="@{/bookmarks(page=${posts.number - 1})}" class="page-btn">← Prev</a>
      <a th:if="${!posts.last}"
         th:href="@{/bookmarks(page=${posts.number + 1})}" class="page-btn">Next →</a>
    </div>
  </main>
</div>

</body>
</html>
