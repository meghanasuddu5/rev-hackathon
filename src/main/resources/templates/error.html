<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Error — Google+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--gp-bg);">
<div style="text-align:center;max-width:480px;padding:40px;">
  <div style="font-size:72px;margin-bottom:16px;">
    <span th:text="${status == 404 ? '🔍' : (status == 403 ? '🔒' : '⚠️')}">⚠️</span>
  </div>
  <h1 style="font-size:28px;font-weight:700;color:var(--gp-text);margin-bottom:8px;"
      th:text="${status}">Error</h1>
  <p style="font-size:16px;color:var(--gp-text-2);margin-bottom:24px;"
     th:text="${error}">Something went wrong.</p>
  <p style="font-size:14px;color:var(--gp-text-3);margin-bottom:24px;"
     th:if="${message}" th:text="${message}"></p>
  <div style="display:flex;gap:12px;justify-content:center;">
    <a href="/feed" class="btn btn-primary">Go Home</a>
    <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
  </div>
</div>
</body>
</html>
