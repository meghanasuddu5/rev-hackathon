<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Communities')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="gp-page">
  <main style="max-width:960px;width:100%;">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
      <h1 style="font-size:22px;font-weight:700;color:var(--gp-text);">👥 Communities</h1>
      <button onclick="document.getElementById('create-community-modal').style.display='flex'"
              class="btn btn-primary">+ Create Community</button>
    </div>

    <!-- Search -->
    <form th:action="@{/communities}" method="get" style="margin-bottom:20px;display:flex;gap:8px;">
      <input type="text" name="q" th:value="${searchQuery}"
             class="gp-input" placeholder="Search communities…"/>
      <button type="submit" class="btn btn-primary">Search</button>
      <a th:if="${searchQuery}" th:href="@{/communities}" class="btn btn-outline">Clear</a>
    </form>

    <!-- My Communities -->
    <div th:if="${!myCommunities.isEmpty()}" style="margin-bottom:24px;">
      <div class="widget-title" style="margin-bottom:12px;">My Communities</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <a th:each="c : ${myCommunities}"
           th:href="@{'/communities/' + ${c.id}}"
           class="category-tag" style="font-size:14px;"
           th:text="${c.name}"></a>
      </div>
    </div>

    <!-- Community Grid -->
    <div th:if="${communities.isEmpty()}" class="empty-state">
      <div class="empty-state-icon">👥</div>
      <div class="empty-state-title">No communities found</div>
      <div class="empty-state-desc">Be the first to create one!</div>
    </div>

    <div class="community-grid">
      <div th:each="community : ${communities}" class="community-card">
        <div class="community-banner">
          <span th:text="${community.category != null ? '🌟' : '👥'}"></span>
        </div>
        <div class="community-card-body">
          <div class="community-name" th:text="${community.name}"></div>
          <div class="community-desc"
               th:text="${community.description != null ? (community.description.length() > 80 ? community.description.substring(0,80) + '…' : community.description) : ''}"></div>
          <div class="community-meta">
            <span th:if="${community.category}" class="category-tag"
                  th:text="${community.category}"></span>
          </div>
          <a th:href="@{'/communities/' + ${community.id}}"
             class="btn btn-primary btn-sm" style="width:100%;justify-content:center;">
            View Community
          </a>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div th:if="${communities.totalPages > 1}" class="pagination">
      <a th:if="${!communities.first}"
         th:href="@{/communities(page=${communities.number - 1})}" class="page-btn">← Prev</a>
      <a th:if="${!communities.last}"
         th:href="@{/communities(page=${communities.number + 1})}" class="page-btn">Next →</a>
    </div>
  </main>
</div>

<!-- Create Community Modal -->
<div id="create-community-modal"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:center;justify-content:center;">
  <div class="gp-card" style="width:100%;max-width:460px;padding:28px;">
    <h2 style="font-size:18px;font-weight:600;margin-bottom:20px;">Create a Community</h2>
    <form th:action="@{/communities/create}" method="post" th:object="${communityDTO}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="gp-form-group">
        <label class="gp-label">Name</label>
        <input type="text" th:field="*{name}" class="gp-input" placeholder="Community name"/>
        <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="gp-form-group">
        <label class="gp-label">Description</label>
        <textarea th:field="*{description}" class="gp-textarea"
                  placeholder="What is this community about?"></textarea>
      </div>
      <div class="gp-form-group">
        <label class="gp-label">Category</label>
        <select th:field="*{category}" class="gp-select">
          <option value="">— Select category —</option>
          <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
        </select>
      </div>
      <div class="gp-form-group">
        <label class="gp-label">Visibility</label>
        <select th:field="*{visibility}" class="gp-select">
          <option value="PUBLIC">🌐 Public</option>
          <option value="PRIVATE">🔒 Private</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Create</button>
        <button type="button" class="btn btn-outline"
                onclick="document.getElementById('create-community-modal').style.display='none'">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
