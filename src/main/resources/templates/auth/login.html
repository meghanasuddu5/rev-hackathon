<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Google+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span style="color:#4285F4;font-weight:700;">G</span><span style="color:#EA4335;font-weight:700;">+</span>
    </div>
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-subtitle">to continue to Google+</p>

    <div th:if="${error}" class="gp-alert gp-alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="gp-alert gp-alert-success" th:text="${success}"></div>
    <div th:if="${message}" class="gp-alert gp-alert-info" th:text="${message}"></div>

    <form th:action="@{/auth/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="gp-form-group">
        <label class="gp-label" for="usernameOrEmail">Username or Email</label>
        <input type="text" id="usernameOrEmail" name="usernameOrEmail"
               class="gp-input" placeholder="Enter username or email"
               autocomplete="username" required autofocus/>
      </div>

      <div class="gp-form-group">
        <label class="gp-label" for="password">Password</label>
        <input type="password" id="password" name="password"
               class="gp-input" placeholder="Enter password"
               autocomplete="current-password" required/>
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;">
        <input type="checkbox" id="remember-me" name="remember-me" style="width:auto;"/>
        <label for="remember-me" style="font-size:14px;color:var(--gp-text-2);">Stay signed in</label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      New to Google+?
      <a th:href="@{/auth/register}" style="font-weight:500;">Create account</a>
    </div>

    <div style="text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--gp-border);">
      <p style="font-size:12px;color:var(--gp-text-3);">
        Demo accounts: <strong>alice</strong> / <strong>Alice@1234</strong>
      </p>
    </div>
  </div>
</div>
</body>
</html>
