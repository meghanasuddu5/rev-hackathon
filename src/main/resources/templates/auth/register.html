<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Google+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">
      <span style="color:#4285F4;font-weight:700;">G</span><span style="color:#EA4335;font-weight:700;">+</span>
    </div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join Google+ today</p>

    <div th:if="${error}" class="gp-alert gp-alert-error" th:text="${error}"></div>

    <form th:action="@{/auth/register}" method="post" th:object="${registerDTO}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="gp-form-group">
        <label class="gp-label">Display Name</label>
        <input type="text" th:field="*{displayName}" class="gp-input"
               placeholder="Your full name" autocomplete="name"/>
        <div class="field-error" th:if="${#fields.hasErrors('displayName')}"
             th:errors="*{displayName}"></div>
      </div>

      <div class="gp-form-group">
        <label class="gp-label">Username</label>
        <input type="text" th:field="*{username}" class="gp-input"
               placeholder="Choose a username" autocomplete="username"/>
        <div class="field-error" th:if="${#fields.hasErrors('username')}"
             th:errors="*{username}"></div>
      </div>

      <div class="gp-form-group">
        <label class="gp-label">Email</label>
        <input type="email" th:field="*{email}" class="gp-input"
               placeholder="your@email.com" autocomplete="email"/>
        <div class="field-error" th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}"></div>
      </div>

      <div class="gp-form-group">
        <label class="gp-label">Password</label>
        <input type="password" th:field="*{password}" class="gp-input"
               placeholder="At least 8 characters" autocomplete="new-password"/>
        <div class="field-error" th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}"></div>
      </div>

      <div class="gp-form-group">
        <label class="gp-label">Confirm Password</label>
        <input type="password" th:field="*{confirmPassword}" class="gp-input"
               placeholder="Repeat your password" autocomplete="new-password"/>
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
             th:errors="*{confirmPassword}"></div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a th:href="@{/auth/login}" style="font-weight:500;">Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
