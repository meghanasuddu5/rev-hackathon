<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Settings')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="gp-page">
  <main class="gp-main">
    <h1 style="font-size:22px;font-weight:700;margin-bottom:20px;">⚙️ Settings</h1>

    <div class="gp-card" style="margin-bottom:16px;">
      <div class="gp-card-header">Account</div>
      <div class="gp-card-body" style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:500;">Display Name</div>
            <div style="font-size:13px;color:var(--gp-text-2);" th:text="${currentUser.displayName}"></div>
          </div>
          <a th:href="@{/profile/edit}" class="btn btn-outline btn-sm">Edit</a>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:500;">Email</div>
            <div style="font-size:13px;color:var(--gp-text-2);" th:text="${currentUser.email}"></div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:500;">Username</div>
            <div style="font-size:13px;color:var(--gp-text-2);" th:text="'@' + ${currentUser.username}"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="gp-card" style="margin-bottom:16px;">
      <div class="gp-card-header">Privacy</div>
      <div class="gp-card-body" style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:500;">Profile Visibility</div>
            <div style="font-size:13px;color:var(--gp-text-2);"
                 th:text="${currentUser.profilePublic ? '🌐 Public' : '🔒 Private'}"></div>
          </div>
          <a th:href="@{/profile/edit}" class="btn btn-outline btn-sm">Change</a>
        </div>
      </div>
    </div>

    <div class="gp-card" style="margin-bottom:16px;">
      <div class="gp-card-header">Session</div>
      <div class="gp-card-body">
        <form th:action="@{/auth/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger">Sign Out</button>
        </form>
      </div>
    </div>

    <div class="gp-card">
      <div class="gp-card-header" style="color:var(--google-red);">Danger Zone</div>
      <div class="gp-card-body">
        <p style="font-size:14px;color:var(--gp-text-2);margin-bottom:12px;">
          Account deletion is permanent and cannot be undone.
        </p>
        <button class="btn btn-danger" onclick="alert('Account deletion requires contacting an admin in this demo.')">
          Delete Account
        </button>
      </div>
    </div>
  </main>
</div>

</body>
</html>
