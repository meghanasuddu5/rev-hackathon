<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="gp-page">
  <main class="gp-main">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h1 style="font-size:22px;font-weight:700;">🔔 Notifications</h1>
      <form th:action="@{/notifications/mark-read}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-outline btn-sm">Mark all read</button>
      </form>
    </div>

    <div class="gp-card">
      <div th:if="${notifications.isEmpty()}" class="empty-state" style="padding:40px;">
        <div class="empty-state-icon">🔕</div>
        <div class="empty-state-title">All caught up!</div>
        <div class="empty-state-desc">No notifications yet.</div>
      </div>

      <div th:each="notif : ${notifications}"
           th:class="${!notif.read ? 'notif-item unread' : 'notif-item'}">
        <div style="font-size:24px;">
          <span th:switch="${notif.type}">
            <span th:case="'NEW_FOLLOWER'">👤</span>
            <span th:case="'POST_LIKE'">👍</span>
            <span th:case="'POST_COMMENT'">💬</span>
            <span th:case="'COMMUNITY_POST'">👥</span>
            <span th:case="*">🔔</span>
          </span>
        </div>
        <div style="flex:1;">
          <div class="notif-msg">
            <a th:if="${notif.actor != null}"
               th:href="@{'/profile/' + ${notif.actor.username}}"
               th:text="${notif.actor.displayName}"
               style="font-weight:600;color:var(--gp-text);"></a>
            <span th:text="' ' + ${notif.message}"></span>
          </div>
          <div class="notif-time"
               th:text="${#temporals.format(notif.createdAt, 'MMM d, yyyy HH:mm')}"></div>
        </div>
        <div th:if="${!notif.read}"
             style="width:8px;height:8px;border-radius:50%;background:var(--gp-primary);flex-shrink:0;margin-top:6px;"></div>
      </div>
    </div>

    <div th:if="${notifications.totalPages > 1}" class="pagination">
      <a th:if="${!notifications.first}"
         th:href="@{/notifications(page=${notifications.number - 1})}" class="page-btn">← Prev</a>
      <a th:if="${!notifications.last}"
         th:href="@{/notifications(page=${notifications.number + 1})}" class="page-btn">Next →</a>
    </div>
  </main>
</div>

</body>
</html>
